version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dewacell-api
    restart: always
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - TZ=Asia/Jakarta
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
